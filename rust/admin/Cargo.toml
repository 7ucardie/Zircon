[workspace]
members  = ["."]
resolver = "2"

[package]
name        = "zircon-admin"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
description = "Zircon admin tools — Tauri app (Rust backend, web frontend)"

[lib]
name = "zircon_admin_lib"
path = "src/lib.rs"

[[bin]]
name = "zircon-admin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri           = { version = "2" }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
zircon-patchmgr = { path = "../patchmgr" }
