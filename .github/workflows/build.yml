name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build-windows:
    name: Build Windows (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore "Zircon Server.sln"

      - name: Build
        run: >
          dotnet build "Zircon Server.sln"
          --no-restore
          --configuration ${{ matrix.configuration }}

      - name: Test
        run: >
          dotnet test "LibraryCore.Tests/LibraryCore.Tests.csproj"
          --no-build
          --configuration ${{ matrix.configuration }}
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload build artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: zircon-release
          path: |
            Release/
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    name: Build Linux (${{ matrix.configuration }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore cross-platform projects
        run: |
          dotnet restore "LibraryCore/LibraryCore.csproj"
          dotnet restore "ServerLibrary/ServerLibrary.csproj"
          dotnet restore "ServerCore/ServerCore.csproj"
          dotnet restore "LibraryCore.Tests/LibraryCore.Tests.csproj"

      - name: Build cross-platform projects
        run: |
          dotnet build "LibraryCore/LibraryCore.csproj" --no-restore --configuration ${{ matrix.configuration }}
          dotnet build "ServerLibrary/ServerLibrary.csproj" --no-restore --configuration ${{ matrix.configuration }}
          dotnet build "ServerCore/ServerCore.csproj" --no-restore --configuration ${{ matrix.configuration }}
          dotnet build "LibraryCore.Tests/LibraryCore.Tests.csproj" --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: >
          dotnet test "LibraryCore.Tests/LibraryCore.Tests.csproj"
          --no-build
          --configuration ${{ matrix.configuration }}
          --logger "trx;LogFileName=test-results.trx"

  build-rust:
    name: Build Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build server crates
        working-directory: rust
        run: cargo build --workspace --exclude zircon-client

      - name: Build client (headless — no windowed deps required)
        working-directory: rust
        run: cargo build -p zircon-client --no-default-features

      - name: Test
        working-directory: rust
        run: cargo test --all

  build-rust-client:
    name: Rust Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-client-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-client-

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Build client (headless)
        working-directory: rust
        run: cargo build -p zircon-client --no-default-features

      - name: Build client (windowed)
        working-directory: rust
        run: cargo build -p zircon-client

      - name: Test client
        working-directory: rust
        run: cargo test -p zircon-client --no-default-features
